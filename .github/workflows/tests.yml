name: Tests

on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Test bash syntax for scripts
        run: scripts/validate.sh --bash

      - name: Test root setup and update scripts
        run: scripts/validate.sh --test

      - name: Verify file structure
        run: scripts/validate.sh --structure

      - name: Verify route and validator coverage
        run: scripts/validate.sh --coverage

      - name: Generate test report
        if: always()
        run: |
          echo "## Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **OS**: ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Shell**: $(bash --version | head -n 1)" >> $GITHUB_STEP_SUMMARY
          echo "- **Git**: $(git --version)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✓ All tests passed successfully" >> $GITHUB_STEP_SUMMARY
