name: Tests

on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Test bash syntax for scripts
        run: scripts/validate.sh --bash

      - name: Test scripts in dry-run mode
        run: |
          echo "Testing scripts execution in test environment..."
          
          # Create a temporary directory for testing
          TEST_DIR=$(mktemp -d)
          cd "$TEST_DIR"
          
          # Copy scripts to test directory
          cp -r "$GITHUB_WORKSPACE/scripts" .
          
          echo "Test directory: $TEST_DIR"
          
          # Verify git is available
          if command -v git &> /dev/null; then
            echo "✓ Git is installed"
            git --version
          else
            echo "✗ Git is not installed"
            exit 1
          fi
          
          echo "✓ Setup script prerequisites met"

      - name: Test piped setup resolves cloned manifest
        run: |
          TEST_DIR=$(mktemp -d)
          mkdir -p "$TEST_DIR/bin"

          cat > "$TEST_DIR/bin/git" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          case "$1" in
            rev-parse)
              [ -d .git ]
              ;;
            clone)
              dest="${@: -1}"
              mkdir -p "$dest/.git"
              if [ "$dest" = "set-me-up" ]; then
                cp "$GITHUB_WORKSPACE/README.md" "$dest/"
                cp -R "$GITHUB_WORKSPACE/scripts" "$dest/"
              fi
              ;;
            *)
              exit 0
              ;;
          esac
          EOF

          chmod +x "$TEST_DIR/bin/git"

          (
            cd "$TEST_DIR"
            PATH="$TEST_DIR/bin:$PATH" bash < "$GITHUB_WORKSPACE/scripts/setup.sh"
          )

          [ -f "$TEST_DIR/set-me-up/scripts/repos.txt" ]

      - name: Test piped setup ignores unrelated git repository
        run: |
          TEST_DIR=$(mktemp -d)
          mkdir -p "$TEST_DIR/bin" "$TEST_DIR/work/.git"
          touch "$TEST_DIR/work/README.md"

          cat > "$TEST_DIR/bin/git" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          case "$1" in
            rev-parse)
              [ -d .git ]
              ;;
            clone)
              dest="${@: -1}"
              mkdir -p "$dest/.git"
              if [ "$dest" = "set-me-up" ]; then
                cp "$GITHUB_WORKSPACE/README.md" "$dest/"
                cp -R "$GITHUB_WORKSPACE/scripts" "$dest/"
              fi
              ;;
            *)
              exit 0
              ;;
          esac
          EOF

          chmod +x "$TEST_DIR/bin/git"

          (
            cd "$TEST_DIR/work"
            PATH="$TEST_DIR/bin:$PATH" bash < "$GITHUB_WORKSPACE/scripts/setup.sh"
          )

          [ -f "$TEST_DIR/work/set-me-up/scripts/repos.txt" ]

      - name: Test setup.sh idempotency
        run: |
          echo "Testing idempotency (checking directory existence logic)..."
          
          # Create a temporary directory
          TEST_DIR=$(mktemp -d)
          cd "$TEST_DIR"
          
          # Copy scripts
          cp -r "$GITHUB_WORKSPACE/scripts" .
          
          # Create a mock directory to test the skip logic
          mkdir -p blueprint
          
          # Test the idempotency by checking if script detects existing directory
          # Create a test script that uses the clone_repo function logic
          cat > test_idempotency.sh << 'EOF'
          #!/bin/bash
          REPO_ROOT="."
          
          # Simplified clone_repo function for testing
          clone_repo() {
              local repo="$1"
              local path="$2"
              
              if [ -d "$REPO_ROOT/$path" ]; then
                  echo "  ✅ $path already exists, skipping..."
                  return 0
              fi
              
              echo "  Would clone $repo into $path"
          }
          
          clone_repo "test-repo" "blueprint"
          EOF
          
          chmod +x test_idempotency.sh
          
          # Run the test and check output
          if ./test_idempotency.sh 2>&1 | grep -q "already exists"; then
            echo "✓ Idempotency check works correctly"
          else
            echo "✗ Idempotency check failed"
            exit 1
          fi

      - name: Verify file structure
        run: scripts/validate.sh --structure

      - name: Generate test report
        if: always()
        run: |
          echo "## Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **OS**: ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Shell**: $(bash --version | head -n 1)" >> $GITHUB_STEP_SUMMARY
          echo "- **Git**: $(git --version)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✓ All tests passed successfully" >> $GITHUB_STEP_SUMMARY
