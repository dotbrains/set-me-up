name: Lint

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**.md'
      - '**.sh'
      - '**.bash'
      - '.github/workflows/lint.yml'
  push:
    branches:
      - master
      - main
    paths:
      - '**.md'
      - '**.sh'
      - '**.bash'
      - '.github/workflows/lint.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Lint Markdown files
        run: npx markdownlint-cli2 "**/*.md" "#blueprint" "#docs" "#home" "#installer" "#modules" "#shared" "#tests" "#utilities"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run ShellCheck
        run: scripts/validate.sh --shell

  bash-syntax:
    name: Bash Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check Bash syntax
        run: bash -n scripts/setup.sh scripts/update.sh scripts/validate.sh
