name: Release Readiness

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-readiness:
    name: Install/update release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout managed repositories
        run: scripts/setup.sh

      - name: Run release readiness check
        id: readiness
        continue-on-error: true
        run: scripts/release-install-update.sh --check --json > release-readiness.json

      - name: Summarize release readiness
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("release-readiness.json")
          if not path.exists():
              print("## Install/update release readiness")
              print("")
              print("Release readiness did not produce an artifact.")
              raise SystemExit(0)

          with path.open(encoding="utf-8") as handle:
              payload = json.load(handle)

          print("## Install/update release readiness")
          print("")
          print(f"- Mode: `{payload['mode']}`")
          print(f"- Stage: `{payload['stage']}`")
          print(f"- Candidate: `{payload['candidate']['ref']}`")
          print(f"- Candidate fresh: `{payload['candidate']['fresh']}`")
          print(f"- Candidate age: `{payload['candidate']['age_days']}` days")
          print(f"- Workflow run: `{payload['provenance']['workflow_run']}`")
          print(f"- Failed: `{payload['failed']}`")
          print("")
          print("| Repository | Branch | Clean | Sync |")
          print("| --- | --- | --- | --- |")
          for repo in payload["repositories"]:
              print(
                  f"| `{repo['path']}` | `{repo['branch']}` | "
                  f"`{repo['clean']}` | `{repo['sync']}` |"
              )
          PY

      - name: Upload release readiness artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness
          path: release-readiness.json
          if-no-files-found: warn

      - name: Open or update readiness failure issue
        if: steps.readiness.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Install/update release readiness is failing"
          body_file="$(mktemp)"
          {
            echo "Release readiness failed for ${GITHUB_REPOSITORY}@${GITHUB_SHA}."
            echo
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            if [ -f release-readiness.json ]; then
              echo '```json'
              cat release-readiness.json
              echo
              echo '```'
            fi
          } > "$body_file"
          gh label create release-readiness \
            --repo "$GITHUB_REPOSITORY" \
            --color "B60205" \
            --description "Install/update release readiness failures" \
            --force
          existing="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --label release-readiness \
              --search "$title in:title" \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --label release-readiness \
              --body-file "$body_file"
          fi

      - name: Close readiness failure issue
        if: steps.readiness.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Install/update release readiness is failing"
          existing="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --label release-readiness \
              --search "$title in:title" \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --body "Release readiness is green again for ${GITHUB_REPOSITORY}@${GITHUB_SHA}."
            gh issue close "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --reason completed
          fi

      - name: Fail workflow on readiness failure
        if: steps.readiness.outcome == 'failure'
        run: exit 1

  branch-protection:
    name: Branch protection drift
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check branch protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/configure-branch-protection.sh --check
