name: Release Readiness

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-readiness:
    name: Install/update release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout managed repositories
        run: scripts/setup.sh

      - name: Run release readiness check
        run: scripts/release-install-update.sh --check --json > release-readiness.json

      - name: Summarize release readiness
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          with open("release-readiness.json", encoding="utf-8") as handle:
              payload = json.load(handle)

          print("## Install/update release readiness")
          print("")
          print(f"- Mode: `{payload['mode']}`")
          print(f"- Stage: `{payload['stage']}`")
          print(f"- Candidate: `{payload['candidate']['ref']}`")
          print(f"- Candidate fresh: `{payload['candidate']['fresh']}`")
          print(f"- Failed: `{payload['failed']}`")
          print("")
          print("| Repository | Branch | Clean | Sync |")
          print("| --- | --- | --- | --- |")
          for repo in payload["repositories"]:
              print(
                  f"| `{repo['path']}` | `{repo['branch']}` | "
                  f"`{repo['clean']}` | `{repo['sync']}` |"
              )
          PY

      - name: Upload release readiness artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness
          path: release-readiness.json
          if-no-files-found: error
